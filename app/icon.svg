    <rect x="262" y="310" width="176" height="84" rx="42" fill="#ffffff" stroke="#065f46" stroke-opacity="0.28" stroke-width="7"/>
    <path d="M350 310 L304 310 A42 42 0 0 0 304 394 L350 394 Z" fill="#a7f3d0"/>
    <line x1="350" y1="316" x2="350" y2="388" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
