<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="black"/>
      <circle cx="210" cy="218" r="122" fill="white"/>
      <circle cx="266" cy="196" r="106" fill="black"/>
    </mask>
  </defs>

  <!-- rounded app tile -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <!-- soft top sheen -->
  <path d="M118 0h276c65 0 118 53 118 118v42c-84 46-208 72-330 60C122 214 56 196 0 168v-50C0 53 53 0 118 0Z" fill="#ffffff" opacity="0.08"/>

